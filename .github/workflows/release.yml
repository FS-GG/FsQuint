name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      identity_check_only:
        description: Check NuGet trusted publishing configuration without publishing
        type: boolean
        default: true
      readback_version:
        description: Verify an already-published version without publishing
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: fsquint-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'FS-GG/FsQuint'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Read-only recovery verification
        if: inputs.readback_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READBACK_VERSION: ${{ inputs.readback_version }}
        run: |
          set -euo pipefail
          [[ "$READBACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          source_head=$(git rev-parse "refs/tags/v$READBACK_VERSION^{commit}")
          python3 eng/readback.py "$READBACK_VERSION" "$source_head"
          bash eng/public-example.sh "$READBACK_VERSION"
      - name: NuGet trusted publishing identity
        id: nuget
        if: inputs.readback_version == ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER || 'Paradigma11' }}
      - name: Provision pinned Quint
        if: github.event_name == 'push'
        run: bash eng/provision-quint.sh "$RUNNER_TEMP/quint-tools"
      - name: Qualify and pack
        if: github.event_name == 'push'
        env:
          QUINT_BIN: ${{ runner.temp }}/quint-tools/quint
          QUINT_HOME: ${{ runner.temp }}/quint-tools/home
        run: |
          set -euo pipefail
          version=$(dotnet msbuild src/FsQuint/FsQuint.fsproj -getProperty:Version)
          test "${GITHUB_REF_NAME}" = "v$version"
          bash eng/check.sh
      - name: Publish identical archives to both feeds
        if: github.event_name == 'push'
        env:
          GH_PACKAGE_KEY: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_PACKAGE_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push 'artifacts/packages/FsQuint*.nupkg' --source https://nuget.pkg.github.com/FS-GG/index.json --api-key "$GH_PACKAGE_KEY" --skip-duplicate --no-symbols
          dotnet nuget push 'artifacts/packages/FsQuint*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$PUBLIC_PACKAGE_KEY" --skip-duplicate
      - name: Read back both feeds
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 eng/readback.py "${GITHUB_REF_NAME#v}"
      - name: Anonymous public package example
        if: github.event_name == 'push'
        run: bash eng/public-example.sh
      - uses: actions/upload-artifact@v7
        if: always() && (github.event_name == 'push' || inputs.readback_version != '')
        with:
          name: packages-${{ github.sha }}
          path: |
            artifacts/packages/*
            artifacts/readback/*
          if-no-files-found: error
