name: automata-providers
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'examples/AutomataProviders/**'
      - 'eng/Qualification/**'
      - '.github/workflows/automata-providers.yml'
      - 'global.json'
      - 'Directory.Build.props'
permissions:
  contents: read
jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex perl pkg-config
      - name: Build pinned private PostgreSQL and extensions
        run: dotnet run --project eng/Qualification/Qualification.fsproj -c Release -- providers-provision "$RUNNER_TEMP/providers"
      - name: Run all provider contracts and process-kill recovery checks
        run: >-
          dotnet run --project eng/Qualification/Qualification.fsproj -c Release --
          providers-check "$RUNNER_TEMP/providers/automata"
          "$RUNNER_TEMP/providers/tools/bin"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automata-provider-evidence
          path: artifacts/automata-providers
